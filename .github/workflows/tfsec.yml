name: tfsec

on:
  push:
    branches: [ "dev", "staging", "prod" ]
  pull_request:
    branches: [ "prod" ]
  schedule:
    - cron: '35 8 * * 0'  # Weekly scan on Sundays at 8:35 UTC

jobs:
  tfsec:
    name: Run tfsec and upload SARIF
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write  # Required to upload SARIF results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tfsec
        run: |
          curl -sSL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec with SARIF output
        run: tfsec . --format sarif --out tfsec.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec.sarif
