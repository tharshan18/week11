name: tfsec

on:
  push:
    branches: [ "prod", "dev", "staging" ]
  pull_request:
    branches: [ "prod" ]
  schedule:
    - cron: '35 8 * * 0'

jobs:
  tfsec:
    name: Run tfsec and upload SARIF
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec with SARIF output
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          format: sarif
          output: tfsec.sarif

      - name: Upload tfsec SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec.sarif
