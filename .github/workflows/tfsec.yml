name: tfsec

on:
  push:
    branches: [ "prod", "dev", "staging" ]
  pull_request:
    branches: [ "prod" ]
  schedule:
    - cron: '35 8 * * 0'

jobs:
  tfsec:
    name: Run tfsec and upload SARIF
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tfsec
        run: |
          wget https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 -O tfsec
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/

